name: Offline audit
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "8"
      OPENBLAS_NUM_THREADS: "8"
      MKL_NUM_THREADS: "8"
      NUMEXPR_NUM_THREADS: "8"
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: nice -n 19 python -m pip install .
      - name: Offline checks
        run: nice -n 19 bash scripts/ci.sh
      - name: Demo and core reproduction
        run: |
          nice -n 19 bash scripts/demo_60s.sh > ci-logs/demo.log 2>&1
          nice -n 19 bash scripts/reproduce_core.sh > ci-logs/reproduce.log 2>&1
          test -s e44_tide/figs/fig_killboard_print.png
          test -s e44_tide/figs/fig_killboard_slide.png
          if rg '跳过重绘' ci-logs/reproduce.log; then exit 1; fi
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-audit-logs
          path: |
            ci-logs/
            tests/*_REPORT.json
